openapi: 3.1.0
info:
  title: IncuBrix B-Roll Studio Engine API
  description: Automated Script and Voiceover to B-roll Video Generation Engine with
    Commercial Licensing and Semantic Timing.
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - System
      summary: Health Check
      description: Liveness probe returning application metadata.
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Check Health Get
  /ready:
    get:
      tags:
      - System
      summary: Readiness Check
      description: Readiness probe checking database, storage, and rendering binaries.
      operationId: readiness_check_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Readiness Check Ready Get
  /api/v1/broll/jobs:
    post:
      tags:
      - B-Roll Engine
      summary: Create a new B-roll video generation job
      description: 'Submits a video creation job from script, audio URL, or structured
        scenes.

        Safe Retries: If Idempotency-Key is provided, repeated requests return the
        same job.'
      operationId: create_broll_job_api_v1_broll_jobs_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/JobCreateRequest'
              - type: 'null'
              title: Payload
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/broll/jobs/upload:
    post:
      tags:
      - B-Roll Engine
      summary: Create a new B-roll video job with direct audio file upload
      description: Multipart upload endpoint supporting direct MP3, WAV, and M4A audio
        files.
      operationId: upload_audio_job_api_v1_broll_jobs_upload_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_audio_job_api_v1_broll_jobs_upload_post'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}:
    get:
      tags:
      - B-Roll Engine
      summary: Check job processing status and progress
      description: Retrieves current job status, 0-100 progress percentage, and artifacts
        when ready.
      operationId: get_job_status_api_v1_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/broll/jobs/{job_id}/result:
    get:
      tags:
      - B-Roll Engine
      summary: Retrieve completed job output artifacts, timeline and manifest
      description: Retrieves all generated video links, captions, manifest.json, and
        timeline.json.
      operationId: get_job_result_api_v1_broll_jobs__job_id__result_get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResultResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/broll/jobs/{job_id}/scenes/{scene_index}/swap:
    post:
      tags:
      - B-Roll Engine
      summary: Swap a scene clip and perform partial re-render (Advanced Requirement
        ADV-2)
      description: 'Replaces one scene''s clip and triggers accelerated partial re-render,

        re-rendering ONLY the affected portion in clearly less time than a full render.'
      operationId: swap_scene_clip_api_v1_broll_jobs__job_id__scenes__scene_index__swap_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: scene_index
        in: path
        required: true
        schema:
          type: integer
          title: Scene Index
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SceneSwapRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs:
    get:
      tags:
      - B-Roll Engine
      summary: List all jobs with optional status filter and pagination
      description: Returns paginated list of recent jobs for the dashboard workspace.
      operationId: list_jobs_api_v1_jobs_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/storage/{file_path}:
    get:
      tags:
      - Storage
      summary: Download or stream an artifact file with Range request support
      description: Streams video or audio with HTTP 206 Partial Content range support.
      operationId: get_storage_artifact_api_v1_storage__file_path__get
      parameters:
      - name: file_path
        in: path
        required: true
        schema:
          type: string
          title: File Path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Body_upload_audio_job_api_v1_broll_jobs_upload_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        voice:
          anyOf:
          - type: string
          - type: 'null'
          title: Voice
          default: en-IN-female
        aspect_ratios:
          anyOf:
          - type: string
          - type: 'null'
          title: Aspect Ratios
          default: '["16:9","9:16"]'
        style:
          anyOf:
          - type: string
          - type: 'null'
          title: Style
          default: bright, modern, real-world footage
        avoid:
          anyOf:
          - type: string
          - type: 'null'
          title: Avoid
          default: '[]'
      type: object
      required:
      - file
      title: Body_upload_audio_job_api_v1_broll_jobs_upload_post
    CaptionsConfig:
      properties:
        burn_in:
          type: boolean
          title: Burn In
          description: Whether captions are burned into the video
          default: true
        srt:
          type: boolean
          title: Srt
          description: Whether an SRT subtitle file is generated
          default: true
      type: object
      title: CaptionsConfig
    ErrorInfo:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        retryable:
          type: boolean
          title: Retryable
          default: false
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Details
      type: object
      required:
      - code
      - message
      title: ErrorInfo
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    JobCreateRequest:
      properties:
        audio_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Audio Url
          description: URL of pre-recorded voiceover (mp3, wav, m4a)
        script:
          anyOf:
          - type: string
          - type: 'null'
          title: Script
          description: Text script for automatic narration generation
        scenes:
          anyOf:
          - items:
              $ref: '#/components/schemas/SceneInputItem'
            type: array
          - type: 'null'
          title: Scenes
          description: Structured IncuBrix scene list
        voice:
          anyOf:
          - type: string
          - type: 'null'
          title: Voice
          description: Narration voice for TTS
          default: en-IN-female
        aspect_ratios:
          items:
            type: string
          type: array
          title: Aspect Ratios
          description: Aspect ratios to render (16:9, 9:16, 1:1)
        style:
          anyOf:
          - type: string
          - type: 'null'
          title: Style
          description: Visual style direction
          default: bright, modern, real-world footage
        avoid:
          items:
            type: string
          type: array
          title: Avoid
          description: Content elements to strictly avoid
        captions:
          $ref: '#/components/schemas/CaptionsConfig'
        callback_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Callback Url
          description: Webhook URL for signed completion callback
      type: object
      title: JobCreateRequest
    JobResultLinks:
      properties:
        video_16_9:
          anyOf:
          - type: string
          - type: 'null'
          title: Video 16 9
        video_9_16:
          anyOf:
          - type: string
          - type: 'null'
          title: Video 9 16
        video_1_1:
          anyOf:
          - type: string
          - type: 'null'
          title: Video 1 1
        captions_srt:
          anyOf:
          - type: string
          - type: 'null'
          title: Captions Srt
        timeline_json:
          anyOf:
          - type: string
          - type: 'null'
          title: Timeline Json
        manifest_json:
          anyOf:
          - type: string
          - type: 'null'
          title: Manifest Json
        audio_narration:
          anyOf:
          - type: string
          - type: 'null'
          title: Audio Narration
      type: object
      title: JobResultLinks
    JobResultResponse:
      properties:
        job_id:
          type: string
          title: Job Id
        status:
          type: string
          title: Status
        aspect_ratios:
          items:
            type: string
          type: array
          title: Aspect Ratios
        artifacts:
          additionalProperties:
            type: string
          type: object
          title: Artifacts
        manifest:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Manifest
        timeline:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Timeline
        cost_estimate_usd:
          type: number
          title: Cost Estimate Usd
          default: 0.0
        processing_duration_sec:
          type: number
          title: Processing Duration Sec
          default: 0.0
      type: object
      required:
      - job_id
      - status
      - aspect_ratios
      - artifacts
      title: JobResultResponse
    JobStatusResponse:
      properties:
        job_id:
          type: string
          title: Job Id
        status:
          type: string
          title: Status
        progress:
          type: integer
          title: Progress
        current_stage:
          type: string
          title: Current Stage
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        result:
          anyOf:
          - $ref: '#/components/schemas/JobResultLinks'
          - type: 'null'
        error:
          anyOf:
          - $ref: '#/components/schemas/ErrorInfo'
          - type: 'null'
      type: object
      required:
      - job_id
      - status
      - progress
      - current_stage
      - created_at
      - updated_at
      title: JobStatusResponse
    SceneInputItem:
      properties:
        text:
          type: string
          minLength: 1
          title: Text
          description: Narration line for the scene
        visual_hint:
          anyOf:
          - type: string
          - type: 'null'
          title: Visual Hint
          description: Optional visual guideline for footage matching
      type: object
      required:
      - text
      title: SceneInputItem
    SceneSwapRequest:
      properties:
        scene_index:
          type: integer
          minimum: 0.0
          title: Scene Index
          description: 0-based index of the scene to swap
        new_clip_id:
          anyOf:
          - type: string
          - type: 'null'
          title: New Clip Id
          description: Specific replacement clip ID
        new_visual_hint:
          anyOf:
          - type: string
          - type: 'null'
          title: New Visual Hint
          description: New visual search hint
        new_provider:
          anyOf:
          - type: string
          - type: 'null'
          title: New Provider
          description: Specific footage provider to draw from
      type: object
      required:
      - scene_index
      title: SceneSwapRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
