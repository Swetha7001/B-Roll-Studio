version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: broll_studio_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/broll_studio
      - DATABASE_SYNC_URL=postgresql://postgres:postgres@db:5432/broll_studio
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_BACKEND=s3
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=broll-studio
      - MINIO_SECURE=false
      - FFMPEG_PATH=ffmpeg
      - FFPROBE_PATH=ffprobe
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - artifacts_data:/app/artifacts/storage

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: broll_studio_worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.job_runner"]
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/broll_studio
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_BACKEND=s3
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=broll-studio
      - MINIO_SECURE=false
    depends_on:
      - db
      - redis
      - minio
    volumes:
      - artifacts_data:/app/artifacts/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: broll_studio_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

  db:
    image: postgres:16-alpine
    container_name: broll_studio_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=broll_studio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: broll_studio_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: broll_studio_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data

volumes:
  pgdata:
  minio_data:
  artifacts_data:
